[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aeroopti"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*", "app*", "configs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
